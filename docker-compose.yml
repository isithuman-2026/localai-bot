services:
  localai-jarvis:
    build: .
    container_name: localai-jarvis
    restart: unless-stopped
    userns_mode: "host"
    env_file: .env
    environment:
      - VAULT_PATH=/vault
      - LOKI_URL=http://monitoring-loki:3100
    volumes:
      - /opt/obsidian-vault:/vault:ro
    networks:
      - ai-agent-net

networks:
  ai-agent-net:
    external: true
    name: ai-agent-net
